server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback: the app is client-routed, so any unknown path must return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or
    # clients keep loading a stale build after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
