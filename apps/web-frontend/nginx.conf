# Rendered by the nginx image's entrypoint, which substitutes ${LOOM_BACKEND_ORIGIN}
# (see apps/web-frontend/Dockerfile). Nginx's own $variables are left alone —
# the entrypoint only substitutes names that exist in the environment.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The API is served under the frontend's own origin, so the browser never
    # makes a cross-origin request and no API host is compiled into the bundle.
    # See docs/adr/0006-frontend-api-same-origin.md.
    location /api/ {
        # Docker's embedded DNS. Resolving through a variable defers lookup to
        # request time, so nginx still starts when the backend is not up yet —
        # a literal proxy_pass host would abort startup with "host not found".
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $backend_origin "${LOOM_BACKEND_ORIGIN}";

        # Strip the /api prefix explicitly. The usual trailing-slash trick on
        # proxy_pass does NOT apply here: when proxy_pass contains a variable,
        # nginx forwards the original URI unchanged instead of substituting the
        # matched location prefix, so /api/health would arrive as /api/health.
        #   /api/health  ->  <backend>/health
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_origin;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Let the backend stream responses (future log/event endpoints).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: the app is client-routed, so any unknown path must return
    # index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or
    # clients keep loading a stale build after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
