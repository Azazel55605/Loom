[package]
name = "loom-connector-docker"
description = "Loom connector for Docker host monitoring, container discovery, and per-container control."
edition.workspace = true
license.workspace = true
version = "0.4.1"
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
loom-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# The Docker Engine API client. Default features are exactly the two transports
# this connector offers — `pipe` for `unix://` sockets and `http` for `tcp://`
# hosts — and deliberately no TLS: a Docker socket is reached over a local
# socket or a trusted network path, and pulling in a TLS stack for a transport
# we do not expose would be dependency weight nobody asked for.
bollard = "0.21"

[dev-dependencies]
# The live-Docker integration tests create their own container to point the
# connector at; they use the same client the connector does rather than a second
# Docker library.
tokio = { workspace = true }
