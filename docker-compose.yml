# Runs published images from GHCR.
#
#   docker compose up -d
#
# No .env file is required — every variable below has a working default. See
# docs/adr/0004-zero-config-startup.md. Copy .env.example to .env only if you
# want to override the image source, pin tags, or change defaults.
#
# To build from local source instead, use docker-compose.local.yml.

services:
  web-backend:
    image: ghcr.io/${LOOM_IMAGE_OWNER:-loom-project}/loom-web-backend:${LOOM_WEB_BACKEND_TAG:-latest}
    ports: ["8080:8080"]
    environment:
      - LOOM_BIND_ADDR=0.0.0.0:8080
      - LOOM_LOG_LEVEL=info
      # Where the backend will persist generated secrets and instance config.
      # Optional, defaulted — see docs/adr/0004-zero-config-startup.md. The
      # volume is declared now so deployments made today don't lose that state
      # when the config system lands.
      - LOOM_DATA_DIR=/data
    volumes:
      - loom-data:/data
    restart: unless-stopped

  web-frontend:
    image: ghcr.io/${LOOM_IMAGE_OWNER:-loom-project}/loom-web-frontend:${LOOM_WEB_FRONTEND_TAG:-latest}
    ports: ["3000:80"]
    depends_on: [web-backend]
    restart: unless-stopped

volumes:
  loom-data:
