# Runs published images from GHCR. Copy .env.example to .env and set
# LOOM_IMAGE_OWNER before using this file.
#
#   docker compose up -d
#
# To build from local source instead, use docker-compose.local.yml.

services:
  web-backend:
    image: ghcr.io/${LOOM_IMAGE_OWNER:?set LOOM_IMAGE_OWNER in .env}/loom-web-backend:${LOOM_WEB_BACKEND_TAG:-latest}
    ports: ["8080:8080"]
    environment:
      - LOOM_BIND_ADDR=0.0.0.0:8080
      - LOOM_LOG_LEVEL=info
    restart: unless-stopped

  web-frontend:
    image: ghcr.io/${LOOM_IMAGE_OWNER:?set LOOM_IMAGE_OWNER in .env}/loom-web-frontend:${LOOM_WEB_FRONTEND_TAG:-latest}
    ports: ["3000:80"]
    depends_on: [web-backend]
    restart: unless-stopped
