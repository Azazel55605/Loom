[workspace]
resolver = "2"
members = ["crates/core", "crates/web-backend"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/<owner>/loom"
rust-version = "1.82"

[workspace.dependencies]
loom-core = { path = "crates/core" }
# `async fn` in traits is stable on our pinned 1.82 toolchain but not
# dyn-compatible, and the connector contract must work as `Box<dyn Connector>`.
async-trait = "0.1"
# `multipart` is on for the avatar upload endpoint: parsing multipart bodies by
# hand is a parser for an under-specified format, which is not a thing to write.
axum = { version = "0.8", features = ["multipart"] }
# Timestamps on the wire need a real date/time type; `default-features = false`
# keeps the oldtime/js-sys baggage out and `serde` gives us RFC 3339 round-trips.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
# Connectors carry service-specific payloads and JSON Schema documents that have
# no fixed Rust shape, so a dynamic `Value` is the only honest representation.
serde_json = "1"
# Error enums with derived `Display`/`source`; the hand-written alternative is
# pure boilerplate on every variant.
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# Argon2id password hashing. The RustCrypto implementation, with the
# `password-hash` PHC string format so parameters travel with the hash.
argon2 = "0.5"
# HS256 JWT encode/decode. Hand-rolling JWT parsing is a well-known source of
# signature-confusion bugs; this validates alg, signature and expiry together.
jsonwebtoken = "9"
# SHA-256 for refresh-token storage. The tokens are already high-entropy random
# values, so a fast hash is the right primitive — see auth/tokens.rs.
sha2 = "0.10"
# CSPRNG for refresh tokens and the JWT signing secret. `getrandom` under the
# hood, i.e. the OS entropy source rather than a seeded PRNG.
rand = "0.8"
# SQLite access plus the migration runner. `runtime-tokio` matches the server's
# executor; no TLS feature, because SQLite is a local file.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "migrate",
    "macros",
    "chrono",
    "uuid",
] }
# Decodes uploaded avatars to prove they are actually images. A declared
# content-type is caller-supplied and proves nothing; decoding is the check.
# `default-features = false` keeps the decoder set to the three formats we
# accept, so we are not carrying — or exposing — parsers for formats no
# endpoint will ever serve.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# v4 identifiers for rows. Random rather than sequential so an id leaks neither
# creation order nor row count.
uuid = { version = "1", features = ["v4", "serde"] }
# CORS headers for the browser clients; hand-rolling correct preflight
# handling is not worth it, and tower-http is already axum's ecosystem.
tower-http = { version = "0.6", features = ["cors", "fs"] }
# Test-only: `ServiceExt::oneshot` drives the axum router directly, so route
# tests need no listener, no port, and no async runtime plumbing.
tower = { version = "0.5", features = ["util"] }
# Test-only: each integration test needs its own SQLite file, removed when the
# test ends, so tests cannot see one another's data.
tempfile = "3"
# Test-only: axum response bodies are streams; `BodyExt::collect` is the
# supported way to read one into bytes for assertions.
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
