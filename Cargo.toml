[workspace]
resolver = "2"
members = ["crates/core", "crates/web-backend"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/<owner>/loom"
rust-version = "1.82"

[workspace.dependencies]
loom-core = { path = "crates/core" }
# `async fn` in traits is stable on our pinned 1.82 toolchain but not
# dyn-compatible, and the connector contract must work as `Box<dyn Connector>`.
async-trait = "0.1"
axum = "0.8"
# Timestamps on the wire need a real date/time type; `default-features = false`
# keeps the oldtime/js-sys baggage out and `serde` gives us RFC 3339 round-trips.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
# Connectors carry service-specific payloads and JSON Schema documents that have
# no fixed Rust shape, so a dynamic `Value` is the only honest representation.
serde_json = "1"
# Error enums with derived `Display`/`source`; the hand-written alternative is
# pure boilerplate on every variant.
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# CORS headers for the browser clients; hand-rolling correct preflight
# handling is not worth it, and tower-http is already axum's ecosystem.
tower-http = { version = "0.6", features = ["cors"] }
# Test-only: `ServiceExt::oneshot` drives the axum router directly, so route
# tests need no listener, no port, and no async runtime plumbing.
tower = { version = "0.5", features = ["util"] }
# Test-only: axum response bodies are streams; `BodyExt::collect` is the
# supported way to read one into bytes for assertions.
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
