name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Both of the following run with default features only, and that is the
      # point: `loom-web-backend`'s `dev-stub-auth` feature must never be
      # enabled here. It compiles in a fake login that accepts any credentials,
      # so it is opt-in at build time and stays out of every CI job that
      # produces or validates a shippable artifact. Do not add `--all-features`
      # or `--features dev-stub-auth` to these steps — see
      # docs/API_CONTRACT.md and crates/web-backend/Cargo.toml.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # sync-versions.mjs has no third-party dependencies, so there is nothing
      # to install and no lockfile to require. Swap this for
      # `pnpm install --frozen-lockfile` + `pnpm versions:sync:check` once the
      # JS clients under apps/ bring in real dependencies.
      - name: Check versions.json is in sync
        run: node scripts/sync-versions.mjs --check
