name: Release web-backend

# Tags follow `v<semver>-<component>`, e.g. `v0.1.0-web-backend`, so each
# product releases independently — matching versions.json. See docs/VERSIONING.md.
on:
  push:
    tags:
      - 'v*.*.*-web-backend'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Safety check: the tag and versions.json must agree, or the release is
      # publishing something other than what the repo says it is.
      - name: Verify tag matches versions.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          tag_version="${tag_version%-web-backend}"
          file_version="$(jq -r '."web-backend"' versions.json)"

          echo "tag version:          $tag_version"
          echo "versions.json entry:  $file_version"

          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $tag implies version $tag_version but versions.json says $file_version. Update versions.json, run 'pnpm versions:sync', and re-tag."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      # GHCR requires a lowercase namespace; GitHub owners may contain capitals.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loom-web-backend" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    # Compile each architecture on matching hardware. Rust release builds under
    # QEMU were 6-12x slower, making one emulated arm64 build dominate the job.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each native job pushes an untagged image by digest. The final job joins
      # those digests under the ordinary version/latest multi-platform tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/web-backend/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Registry caches survive across release tags. Separate architecture
          # refs prevent incompatible layers and concurrent writes colliding.
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: web-backend-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: web-backend-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find /tmp/digests -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected two platform digests, found ${#digests[@]}."
            exit 1
          fi

          images=()
          for digest in "${digests[@]}"; do
            images+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${images[@]}"

      - name: Verify published platforms
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
