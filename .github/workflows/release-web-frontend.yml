name: Release web-frontend

# Tags follow `v<semver>-<component>`, e.g. `v0.1.0-web-frontend`, so each
# product releases independently — matching versions.json. See docs/VERSIONING.md.
on:
  push:
    tags:
      - 'v*.*.*-web-frontend'

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Safety check: the tag and versions.json must agree, or the release is
      # publishing something other than what the repo says it is.
      - name: Verify tag matches versions.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          tag_version="${tag_version%-web-frontend}"
          file_version="$(jq -r '."web-frontend"' versions.json)"

          echo "tag version:          $tag_version"
          echo "versions.json entry:  $file_version"

          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag $tag implies version $tag_version but versions.json says $file_version. Update versions.json, run 'pnpm versions:sync', and re-tag."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      # GHCR requires a lowercase namespace; GitHub owners may contain capitals.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loom-web-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-frontend/Dockerfile
          push: true
          # No VITE_API_URL: the bundle calls /api relative to its own origin
          # and nginx proxies it, so one published image works for every
          # deployment. Baking a URL here would make the image usable only by
          # whoever it was built for. See docs/adr/0006-frontend-api-same-origin.md.
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
