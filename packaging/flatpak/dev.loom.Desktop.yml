# Flatpak manifest for the Loom desktop client.
#
# RUNTIME CHOICE: this uses the GNOME runtime, not org.freedesktop.Platform.
# Tauri renders through webkit2gtk, and WebKitGTK ships as part of the GNOME
# runtime — the freedesktop runtime does not provide it and has no webkit
# extension, so a Tauri app cannot start there without vendoring WebKit itself.
# This follows Tauri's own Flatpak guidance. org.gnome.Sdk is built on top of
# org.freedesktop.Sdk, so the freedesktop toolchain is still underneath.
#
# NOTE: this manifest validates that the app BUILDS and bundles. Flathub
# submission is a separate process — the manifest is hosted in Flathub's own
# repository, goes through their review, and must build fully offline (see the
# network note on the build-options below). Not solved here.

app-id: dev.loom.Desktop
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: loom-desktop

finish-args:
  # Reach the user's Loom backend over the network. The whole point of the app.
  - --share=network
  # Rendering: Wayland preferred, X11 as fallback, plus GPU access.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Shared memory between the app and the compositor.
  - --share=ipc

modules:
  - name: loom-desktop
    buildsystem: simple
    build-options:
      # Cargo and pnpm both need to fetch dependencies during the build.
      # Flathub forbids network access at build time and requires vendored
      # sources generated by flatpak-builder-tools (flatpak-cargo-generator /
      # flatpak-node-generator). Producing those lockfile-derived source lists
      # is the main remaining task before a Flathub submission.
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/loom-desktop/cargo
    build-commands:
      - npm install -g pnpm@11.3.0
      - pnpm install --frozen-lockfile
      - pnpm --filter desktop tauri build --bundles deb
      # Unpack the .deb Tauri produced and lay its contents into /app.
      - ar x apps/desktop/src-tauri/target/release/bundle/deb/*.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/loom-desktop /app/bin/loom-desktop
      - install -Dm644 usr/share/applications/Loom.desktop
        /app/share/applications/dev.loom.Desktop.desktop
      - |
        for dir in usr/share/icons/hicolor/*/apps; do
          size=$(basename "$(dirname "$dir")")
          install -Dm644 "$dir/loom-desktop.png" \
            "/app/share/icons/hicolor/${size}/apps/dev.loom.Desktop.png"
        done
      # Flatpak requires the desktop entry's Icon= to match the app-id.
      - desktop-file-edit --set-icon=dev.loom.Desktop
        /app/share/applications/dev.loom.Desktop.desktop
    sources:
      # The repo root, so the pnpm workspace and lockfile are present.
      - type: dir
        path: ../..
